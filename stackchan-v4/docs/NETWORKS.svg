<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1330" width="1700" height="1330">
<rect width="1700" height="1330" fill="#0f1420"/>
<text x="40" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" fill="#e6ebf5" font-weight="bold" text-anchor="start">The trained networks of the StackChan robot (platform B)</text>
<text x="40" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#9aa6bf" font-weight="normal" text-anchor="start">M5Stack CoreS3 / ESP32-S3, one brain tick every 50 ms. Everything else (filter bank, front ends, safety limits, synthesizer) is ordinary C++.</text>
<rect x="40" y="110" width="1620" height="152" rx="10" fill="#171e2e" stroke="#2f6fdd" stroke-width="2.5"/>
<rect x="40" y="110" width="1620" height="32" rx="10" fill="#2f6fdd"/><rect x="40" y="130" width="1620" height="12" fill="#2f6fdd"/>
<text x="54" y="133" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">1  Vision CNN</text>
<text x="54" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">3 conv layers (8, 16, 24 filters, 3x3, pooling) + dense 64 -&gt; 13 outputs</text>
<text x="54" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Input: 32x24 image, 3 channels (luminance, ego-motion-compensated difference, raw difference) + 4 side values</text>
<text x="54" y="212" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Output: motion per region, person, face, approaching / receding, target x/y/confidence, activity</text>
<text x="54" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">INT8, ~26 ms per frame at 7 fps (camera task, core 1); fine-tuned every night on its own frames (teachers on the PC)</text>
<text x="1230" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="bold" text-anchor="start">Files and sizes</text>
<text x="1230" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">weights in flash: 24.8 KB</text>
<text x="1230" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9aa6bf" font-weight="normal" text-anchor="start">  (24,344 INT8 weights + 1.0 KB scales / tables)</text>
<text x="1230" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">C++ header vision_model_data.h: 80.3 KB</text>
<text x="1230" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">PyTorch checkpoint vision_net.pt: 99.2 KB</text>
<rect x="40" y="276" width="1620" height="152" rx="10" fill="#171e2e" stroke="#2f6fdd" stroke-width="2.5"/>
<rect x="40" y="276" width="1620" height="32" rx="10" fill="#2f6fdd"/><rect x="40" y="296" width="1620" height="12" fill="#2f6fdd"/>
<text x="54" y="299" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">2  Auditory MLP</text>
<text x="54" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">dense 64 -&gt; 32 -&gt; 8</text>
<text x="54" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Input: 100 = 16 filter-bank bands x 6 frames + level, balance, 'I speak', 'my servos run'</text>
<text x="54" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Output: silence, speech, clap, sharp, continuous noise, low, high, tonal</text>
<text x="54" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">INT8, ~1.5 ms per brain tick; fine-tuned every night on its own sound (teachers on the PC)</text>
<text x="1230" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="bold" text-anchor="start">Files and sizes</text>
<text x="1230" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">weights in flash: 9.3 KB</text>
<text x="1230" y="376" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9aa6bf" font-weight="normal" text-anchor="start">  (8,704 INT8 weights + 0.8 KB scales / tables)</text>
<text x="1230" y="396" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">C++ header auditory_model_data.h: 30.7 KB</text>
<text x="1230" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">PyTorch checkpoint auditory_net.pt: 37.0 KB</text>
<rect x="40" y="442" width="1620" height="152" rx="10" fill="#171e2e" stroke="#d9534f" stroke-width="2.5"/>
<rect x="40" y="442" width="1620" height="32" rx="10" fill="#d9534f"/><rect x="40" y="462" width="1620" height="12" fill="#d9534f"/>
<text x="54" y="465" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">3  Spiking core (mode brain only)</text>
<text x="54" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">768 leaky integrate-and-fire neurons, 258 inputs (dense 258x768 projection), ~47.7 k sparse recurrent synapses</text>
<text x="54" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Input: perception, body, context, prediction errors, noise pacemakers</text>
<text x="54" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Output: 25 inner-state readouts - curiosity, arousal, boredom, annoyance, social need, playfulness, fatigue, sleep, attention</text>
<text x="54" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">INT8, ~7 ms per brain tick (20 Hz); surrogate gradients. Off in mode life (platform B): kept as the way back</text>
<text x="1230" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="bold" text-anchor="start">Files and sizes</text>
<text x="1230" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">weights in flash: 395.0 KB</text>
<text x="1230" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9aa6bf" font-weight="normal" text-anchor="start">  (199,616 INT8 weights + 200.0 KB scales / tables)</text>
<text x="1230" y="562" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">C++ header snn_model_data.h: 966.9 KB</text>
<text x="1230" y="582" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">PyTorch checkpoint snn.pt: 3.72 MB</text>
<rect x="40" y="608" width="1620" height="152" rx="10" fill="#171e2e" stroke="#2f6fdd" stroke-width="2.5"/>
<rect x="40" y="608" width="1620" height="32" rx="10" fill="#2f6fdd"/><rect x="40" y="628" width="1620" height="12" fill="#2f6fdd"/>
<text x="54" y="631" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">4  Policy GRU (mode brain only)</text>
<text x="54" y="666" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">dense 64 -&gt; GRU 64 -&gt; dense 48 -&gt; 51 outputs</text>
<text x="54" y="688" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Input: 100 = all perception + SNN state + previous action + 2 slow-need clocks + 2 learned expectations</text>
<text x="54" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Output: head target, gaze, blink, which of 21 faces, sound intent (pitch, glide, length, style), sing, invite, startle</text>
<text x="54" y="732" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">INT8, ~4 ms per brain tick; imitation of a designed teacher + DAgger. In mode life the actor (7) decides instead</text>
<text x="1230" y="666" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="bold" text-anchor="start">Files and sizes</text>
<text x="1230" y="688" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">weights in flash: 39.9 KB</text>
<text x="1230" y="708" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9aa6bf" font-weight="normal" text-anchor="start">  (36,496 INT8 weights + 4.3 KB scales / tables)</text>
<text x="1230" y="728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">C++ header policy_model_data.h: 133.9 KB</text>
<text x="1230" y="748" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">PyTorch checkpoint policy_net.pt: 147.8 KB</text>
<rect x="40" y="774" width="1620" height="152" rx="10" fill="#171e2e" stroke="#b06bd1" stroke-width="2.5"/>
<rect x="40" y="774" width="1620" height="32" rx="10" fill="#b06bd1"/><rect x="40" y="794" width="1620" height="12" fill="#b06bd1"/>
<text x="54" y="797" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">5  BabbleNet GRU</text>
<text x="54" y="832" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">dense 56 -&gt; 64, GRU 48, dense 48 -&gt; 48, 171 outputs</text>
<text x="54" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Input: sound intent (12) + the shown face (21 one-hot) + the phrase state</text>
<text x="54" y="876" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Output: next note - kind (10 droid sounds), glide, ending, pitch, FM, harmonics, rate, stop</text>
<text x="54" y="898" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">INT8, own audio task (core 1, priority 5); the sound itself is an analogue-style droid synthesizer, not a network</text>
<text x="1230" y="832" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="bold" text-anchor="start">Files and sizes</text>
<text x="1230" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">weights in flash: 34.3 KB</text>
<text x="1230" y="874" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9aa6bf" font-weight="normal" text-anchor="start">  (30,224 INT8 weights + 4.8 KB scales / tables)</text>
<text x="1230" y="894" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">C++ header babble_model_data.h: 117.3 KB</text>
<text x="1230" y="914" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">PyTorch checkpoint babble_net.pt: 123.4 KB</text>
<rect x="40" y="940" width="1620" height="152" rx="10" fill="#171e2e" stroke="#2f6fdd" stroke-width="2.5"/>
<rect x="40" y="940" width="1620" height="32" rx="10" fill="#2f6fdd"/><rect x="40" y="960" width="1620" height="12" fill="#2f6fdd"/>
<text x="54" y="963" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">6  World model GRU (platform B)</text>
<text x="54" y="998" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">dense 64 -&gt; GRU 64 -&gt; dense 48 -&gt; 49 outputs</text>
<text x="54" y="1020" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Input: 154 = the policy's input + the action + the efference copy of this tick</text>
<text x="54" y="1042" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Output: the change of every sensed value (vision, hearing, body) in the next tick; its error is the robot's surprise</text>
<text x="54" y="1064" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">INT8, ~4 ms per brain tick; retrained every night from the whole diary (gate: skill against persistence)</text>
<text x="1230" y="998" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="bold" text-anchor="start">Files and sizes</text>
<text x="1230" y="1020" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">weights in flash: 43.2 KB</text>
<text x="1230" y="1040" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9aa6bf" font-weight="normal" text-anchor="start">  (39,856 INT8 weights + 4.3 KB scales / tables)</text>
<text x="1230" y="1060" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">C++ header world_model_data.h: 140.7 KB</text>
<text x="1230" y="1080" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">PyTorch checkpoint world_net.pt: 161.0 KB</text>
<rect x="40" y="1106" width="1620" height="152" rx="10" fill="#171e2e" stroke="#2f6fdd" stroke-width="2.5"/>
<rect x="40" y="1106" width="1620" height="32" rx="10" fill="#2f6fdd"/><rect x="40" y="1126" width="1620" height="12" fill="#2f6fdd"/>
<text x="54" y="1129" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">7  Actor GRU + online learner (platform B)</text>
<text x="54" y="1164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">dense 64 -&gt; GRU 64 -&gt; dense 48 -&gt; 24 outputs, + a plastic layer dW 8 x 48 learned on the robot by day</text>
<text x="54" y="1186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Input: 71 = senses, the 5 needs, world-model errors, learned expectations</text>
<text x="54" y="1208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">Output: start a move, where (Gaussian yaw / pitch), speed, call, value, 12 face and 4 voice-style logits</text>
<text x="54" y="1230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c2d9" font-weight="normal" text-anchor="start">INT8; night: advantage-weighted regression on the diary; day: TD(lambda) actor-critic with eligibility traces</text>
<text x="1230" y="1164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="bold" text-anchor="start">Files and sizes</text>
<text x="1230" y="1186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e6ebf5" font-weight="normal" text-anchor="start">weights in flash: 36.6 KB</text>
<text x="1230" y="1206" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9aa6bf" font-weight="normal" text-anchor="start">  (33,344 INT8 weights + 4.1 KB scales / tables)</text>
<text x="1230" y="1226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">C++ header actor_model_data.h: 129.5 KB</text>
<text x="1230" y="1246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#e6ebf5" font-weight="normal" text-anchor="start">PyTorch checkpoint life_actor.pt: 135.4 KB</text>
<rect x="40" y="1272" width="1620" height="62" rx="10" fill="#10262b" stroke="#26a6a6" stroke-width="2"/>
<text x="54" y="1298" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#e6ebf5" font-weight="bold" text-anchor="start">Total weight data of all seven networks in flash: 583.1 KB  -  whole firmware image 2.07 MB</text>
<text x="54" y="1321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9aa6bf" font-weight="normal" text-anchor="start">INT8 with per-channel scales. The nightly weights also travel in one blob (SCW1) over Wi-Fi into a spare flash slot (2 x 1.5 MB) and are switched without a reboot.</text>
<rect x="40" y="1348" width="1620" height="96" rx="10" fill="#171e2e" stroke="#b06bd1" stroke-width="2"/>
<text x="54" y="1374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#e6ebf5" font-weight="bold" text-anchor="start">On the home PC only (never on the robot, nothing leaves the home network)</text>
<text x="54" y="1398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#b8c2d9" font-weight="normal" text-anchor="start">Critic GRU (state 71 -&gt; value, gamma 0.995): the advantage for the actor's night training  -  checkpoint 119.5 KB</text>
<text x="54" y="1420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#b8c2d9" font-weight="normal" text-anchor="start">Teachers that label the robot's own frames and sounds: YOLOv8n (persons, 80 objects), YuNet (faces), Silero VAD (speech), PANNs CNN14 (527 sound classes)</text>
</svg>